[project]
name = "evidencegate"
version = "0.1.0"
description = "Ambiente do MVP EvidenceGate para o hackathon NeuraLake"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "openai>=1.50,<3",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "reportlab>=4,<5",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.18,<1",
    "structlog>=24,<27",
    "tenacity>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
