<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvidenceGate — auditor de voz</title>
<link rel="stylesheet" href="/static/eg.css">
<style>
.hero{position:relative;min-height:100vh;overflow:hidden;display:flex;
  flex-direction:column}
.stage{position:relative;flex:1;display:flex;align-items:center;
  justify-content:center;padding:120px 20px 80px}
h1{font-size:22px;font-weight:300;letter-spacing:-0.02em}
.card{width:100%;max-width:480px;border-radius:var(--r-xl);
  padding:36px;text-align:center}
.card .sub{color:var(--mute-2);font-size:14px;margin:6px 0 24px}
.status{border-radius:var(--r-md);padding:14px 16px;font-size:13px;
  color:var(--mute-2);margin-bottom:20px;min-height:52px;text-align:left;
  background:rgba(255,255,255,.5);border:1px solid var(--hairline)}
.status b{color:var(--ink);font-weight:450;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--mute);margin-right:8px;vertical-align:1px}
.dot.on{background:var(--ok)}
.vbtns{display:flex;gap:12px;justify-content:center}
.stop{background:var(--bad);color:#fff}
.stop:hover{background:#b91f4a}
.log{text-align:left;font-size:11px;color:var(--mute);max-height:110px;
  overflow:auto;margin-top:18px;font-feature-settings:"tnum";line-height:1.7}
.nav-spacer .links a{color:var(--mute-2)}
</style></head><body>
<div class="hero"><div class="mesh"><i></i><i></i><i></i><i></i><i></i></div>
<nav class="nav glass"><div class="nav-in">
  <a class="wordmark" href="/">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#533afd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3.5v5.2c0 5-3.4 9.3-8 10.8-4.6-1.5-8-5.8-8-10.8V5.5L12 2z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/></svg>
    EvidenceGate</a>
  <div class="links">
    <a href="/">Home</a>
    <a href="/design">Design</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/voice" aria-current="page">Voz</a>
    <a href="/docs">API</a>
    <a class="btn btn-primary btn-sm" href="/dashboard">Ver ao vivo</a>
  </div>
</div></nav>
<div class="stage"><div class="card glass">
  <h1 class="h-lg">Auditor de voz</h1>
  <div class="sub">Agora ConvoAI + NeuraLake — respostas com dados reais
  do registry</div>
  <div class="status"><span class="dot" id="dot"></span><b id="stt">desconectado</b>
    <br><span id="sts">clique em conectar e permita o microfone</span></div>
  <div class="vbtns">
    <button class="btn btn-primary" id="btn" onclick="go()">Conectar e falar</button>
    <button class="btn stop" id="stop" onclick="end()" style="display:none">Encerrar</button>
  </div>
  <div class="log" id="log"></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.3/AgoraRTC_N-production.js"></script>
<script>
let client=null,mic=null,agentId=null;
const $=id=>document.getElementById(id);
function log(m){$("log").innerHTML+=m+"<br>";$("log").scrollTop=1e6}
function st(t,s,on){$("stt").textContent=t;$("sts").textContent=s;
$("dot").className="dot"+(on?" on":"")}
let volTimer=null;
const withTimeout=(p,ms,what)=>Promise.race([p,
new Promise((_,rj)=>setTimeout(()=>rj(new Error(what+" — timeout "+ms/1000+"s")),ms))]);
async function go(){
try{
st("conectando","pedindo config do servidor...");$("btn").disabled=true;
const cfg=(await (await fetch("/voice/config")).json()).data;
log("canal: "+cfg.channel_name+" uid:"+cfg.uid);
client=AgoraRTC.createClient({mode:"rtc",codec:"vp8"});
client.on("user-published",async(u,mt)=>{
await client.subscribe(u,mt);
if(mt==="audio"){try{u.audioTrack.play()}catch(_){}
log("audio remoto tocando (agente)")}});
log("entrando no canal...");
await withTimeout(client.join(cfg.app_id,cfg.channel_name,cfg.token,
parseInt(cfg.uid)),15000,
"join falhou — a rede pode estar bloqueando WebRTC/UDP (VPN, firewall corporativo ou CGNAT). Tenta outra rede");
log("no canal. pedindo microfone...");
st("no canal","entrando com microfone...");
try{mic=await withTimeout(AgoraRTC.createMicrophoneAudioTrack(),12000,"mic")}
catch(e){throw new Error("microfone indisponivel: "+(e.message||e)+
" — libera o mic no navegador (cadeado na barra) e fecha outros apps que usam mic")}
log("mic ok. publicando...");
await withTimeout(client.publish([mic]),12000,"publish travou");
log("publicado. iniciando agente ConvoAI...");
volTimer=setInterval(()=>{if(mic){const v=mic.getVolumeLevel();
$("sts").textContent="mic: "+(v>0.02?"captando ("+v.toFixed(2)+")":"sem som — fala mais perto")}},800);
st("chamando agente","iniciando ConvoAI...");
const r=await (await fetch("/voice/start",{method:"POST",
headers:{"Content-Type":"application/json"},body:JSON.stringify({
channelName:cfg.channel_name,rtcUid:parseInt(cfg.agent_uid),userUid:parseInt(cfg.uid)})})).json();
if(r.code!==0)throw new Error("startAgent: "+JSON.stringify(r));
agentId=r.data.agent_id;
log("agent_id: "+agentId);
st("AO VIVO","fale agora — o auditor responde com dados reais do registry",true);
$("btn").style.display="none";$("stop").style.display="inline-block";
}catch(e){log("ERRO: "+(e.message||e));st("erro",e.message||String(e));
$("btn").disabled=false;}}
async function end(){
if(agentId)try{await fetch("/voice/stop",{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({agentId:agentId})})}catch(e){}
if(volTimer){clearInterval(volTimer);volTimer=null}
if(mic){mic.close();mic=null}
if(client){await client.leave();client=null}
agentId=null;st("desconectado","sessao encerrada");
$("stop").style.display="none";$("btn").style.display="inline-block";
$("btn").disabled=false;}
</script></body></html>
